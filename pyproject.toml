[project]
name = "bookworm-project"
version = "0.1.0"
description = "Bookworm Library RAG Agent"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain-core>=1.8.1",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.22",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "requests>=2.34.2",
    "streamlit>=1.67.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookworm"]
