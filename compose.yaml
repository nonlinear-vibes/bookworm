# Stub: three services, matching the planned Docker setup.
# TODO: finish and test once everything works locally.

services:
  ollama:
    image: ollama/ollama
    # TODO: entrypoint that pulls the models on first start.
    # entrypoint: ["/bin/sh", "/ollama-entrypoint.sh"]
    volumes:
      - ollama:/root/.ollama
      # - ./docker/ollama-entrypoint.sh:/ollama-entrypoint.sh:ro
    # TODO: GPU access requires the NVIDIA container runtime.

  qdrant:
    image: qdrant/qdrant
    volumes:
      - ./data/qdrant_storage:/qdrant/storage

  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    depends_on:
      - ollama
      - qdrant
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      SQLITE_PATH: /app/data/sqlite/bookworm.db
    volumes:
      - ./data:/app/data

volumes:
  ollama:
